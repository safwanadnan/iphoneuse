version: 2
project_name: iphoneuse
builds:
  - main: ./cmd/iphoneuse
    binary: iphoneuse
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [arm64, amd64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    name_template: "iphoneuse_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]
checksum:
  name_template: checksums.txt
# A cask (not a formula): Homebrew installs it without needing up-to-date
# Command Line Tools, which are often stale right after a macOS upgrade.
homebrew_casks:
  - name: iphoneuse
    repository:
      owner: safwanadnan
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/safwanadnan/iphoneuse
    description: Computer use, for your iPhone - let Claude, ChatGPT and other AI agents use your iPhone
    license: MIT
    binaries: [iphoneuse]
    caveats: |
      Plug in your iPhone and run:
        iphoneuse setup
    hooks:
      post:
        # The binary isn't notarized by Apple; drop the download quarantine
        # so Gatekeeper doesn't block it.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/iphoneuse"]
          end
