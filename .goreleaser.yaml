version: 2
project_name: iphoneuse
builds:
  - main: ./cmd/iphoneuse
    binary: iphoneuse
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [arm64, amd64]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    name_template: "iphoneuse_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]
checksum:
  name_template: checksums.txt
brews:
  - name: iphoneuse
    repository:
      owner: safwanadnan
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/safwanadnan/iphoneuse
    description: Computer use, for your iPhone - let Claude, ChatGPT and other AI agents use your iPhone
    license: MIT
    install: |
      bin.install "iphoneuse"
    caveats: |
      Plug in your iPhone and run:
        iphoneuse setup
    test: |
      system "#{bin}/iphoneuse", "--version"
