# XcodeGen spec for the on-device helper.
# Regenerate the committed project with:  make helper-project
name: iPhoneUseHelper
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    # iphoneuse sets this to ".<teamid>" so every user gets their own bundle id
    # (free Apple IDs cannot share bundle ids across teams).
    IPHONEUSE_BUNDLE_SUFFIX: ""
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  iPhoneUseRunner:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iPhoneUseRunner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.iphoneuse.runner$(IPHONEUSE_BUNDLE_SUFFIX)
        PRODUCT_NAME: iPhoneUse
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: iPhoneUseRunner/iPhoneUseRunner-Bridging-Header.h
        CLANG_ENABLE_OBJC_ARC: YES
        ENABLE_TESTING_SEARCH_PATHS: YES
schemes:
  iPhoneUseRunner:
    build:
      targets:
        iPhoneUseRunner: [test]
    test:
      targets:
        - iPhoneUseRunner
